pre-push:
  commands:
    rspec:
      tags:
        - backend
        - rspec
        - test
      run: docker compose exec -T web bundle exec rspec

pre-commit:
  commands:
    rubocop:
      tags: backend style
      glob:
        - "*.rb"
        - "*.rake"
        - "*.gemspec"
        - "Gemfile"
        - "Rakefile"
      run: bin/rubocop --force-exclusion -- {staged_files}
